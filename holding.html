<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>HYPERSEEK</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #211d1e;
      background-image:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(118, 167, 75, 0.12) 0%, transparent 65%);
    }
    .holding {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      animation: fade-in 0.8s ease-out both;
    }
    .holding__logo {
      width: min(280px, 72vw);
      height: auto;
      filter: drop-shadow(0 12px 40px rgba(0, 0, 0, 0.35));
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="holding">
    <img
      class="holding__logo"
      src="assets/images/logo-icon.png"
      alt=""
      width="322"
      height="220"
    >
  </main>
</body>
</html>
