<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hero KV 方案預覽（內部）</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, "Noto Sans TC", sans-serif; background: #0d0c0c; color: #eee; padding: 24px; }
    h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 0.85rem; color: #999; margin-bottom: 16px; max-width: 720px; line-height: 1.6; }
    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); margin-bottom: 32px; }
    .grid--focus article h3 { color: #b8e08a; }
  </style>
</head>
<body>
  <h1>Hero 主視覺方案（內部比稿）</h1>
  <p>目前上線：<strong style="color:#8BB863">方案 A</strong>。換版請改 <code>index.html</code> 的 <code>hero-kv.svg</code> 檔名。</p>
  <h2 style="font-size:0.95rem;margin:28px 0 12px;color:#c9a66a">★ 產品意象系列（依客戶實機發想）</h2>
  <p style="margin-top:-8px;margin-bottom:12px;font-size:0.8rem">側視圓柱段、進氣盆＋鼻錐三臂、尾噴口與金屬環—避免雷達式 360° 放射。</p>
  <div class="grid" id="grid-product" style="margin-bottom:32px"></div>
  <h2 style="font-size:0.95rem;margin:28px 0 12px;color:#8BB863">集中視覺系列</h2>
  <p style="margin-top:-8px;margin-bottom:12px;font-size:0.8rem">單一焦點約在畫面中央偏右，線條收斂、不散落滿版。</p>
  <div class="grid grid--focus" id="grid-focus"></div>
  <h2 style="font-size:0.95rem;margin:28px 0 12px;color:#ccc">色線加強系列（橫向發散）</h2>
  <div class="grid" id="grid-bold"></div>
  <h2 style="font-size:0.95rem;margin:28px 0 12px;color:#ccc">標準系列</h2>
  <div class="grid" id="grid"></div>
  <script>
    function renderCard(o, style) {
      const styles = {
        product: { border: '#c9a66a', glow: 'box-shadow:0 0 28px rgba(201,166,106,0.2)' },
        focus: { border: '#76A74B', glow: 'box-shadow:0 0 24px rgba(118,167,75,0.15)' },
        bold: { border: '#4a7330', glow: 'box-shadow:0 0 0 1px rgba(139,184,99,0.25)' },
        std: { border: '#333', glow: '' },
      };
      const s = styles[style];
      return `
        <article>
          <div style="border:1px solid ${s.border};border-radius:12px;overflow:hidden;margin-bottom:8px;${s.glow}">
            <img src="assets/images/${o.file}" alt="" style="width:100%;aspect-ratio:3/2;object-fit:cover;display:block">
          </div>
          <h3 style="font-size:0.95rem;margin-bottom:4px">${o.title}</h3>
          <p style="font-size:0.8rem;color:#888;margin:0">${o.desc}</p>
        </article>
      `;
    }
    const product = [
      { id: 'P1', file: 'hero-kv-engine-profile-bold.svg', title: 'P1 · 側視剖面', desc: '圓柱環帶 + 安裝耳 + 尾錐噴流（單軸推力）' },
      { id: 'P2', file: 'hero-kv-engine-intake-bold.svg', title: 'P2 · 進氣正面', desc: '雙環 + 三臂鼻錐（對應實機進氣）' },
      { id: 'P3', file: 'hero-kv-engine-stack-bold.svg', title: 'P3 · 本體環段', desc: '側向角度金屬環，非平面雷達' },
      { id: 'P4', file: 'hero-kv-engine-exhaust-bold.svg', title: 'P4 · 尾噴口', desc: '耐熱鼻錐色 + 單向噴流' },
      { id: 'P5', file: 'hero-kv-engine-duotone.svg', title: 'P5 · 實機剪影', desc: '產品照低透明度＋暗角（不搶文案）' },
    ];
    const focus = [
      { id: 'H1', file: 'hero-kv-focus-plume-bold.svg', title: 'H1 · 中心噴流（加強）', desc: '放射橢圓 + 中心噴口，色線飽和' },
      { id: 'H2', file: 'hero-kv-focus-plume.svg', title: 'H2 · 中心噴流', desc: '低調版同心尾焰' },
      { id: 'H3', file: 'hero-kv-focus-rings-bold.svg', title: 'H3 · 中心渦輪環', desc: '三層同心圓集中在焦點' },
      { id: 'H4', file: 'hero-kv-focus-burst-bold.svg', title: 'H4 · 中心放射', desc: '短射線，不拉滿畫面' },
      { id: 'H5', file: 'hero-kv-focus-flow-bold.svg', title: 'H5 · 中心層流', desc: '橢圓層流包覆核心' },
      { id: 'H6', file: 'hero-kv-focus-wing-bold.svg', title: 'H6 · 中心雙翼', desc: 'Logo 置中 + 暈圈' },
      { id: 'H7', file: 'hero-kv-focus-axis-bold.svg', title: 'H7 · 中心軸線', desc: '十字推力軸，最簡潔' },
      { id: 'H8', file: 'hero-kv-focus-axis.svg', title: 'H8 · 中心軸線（淡）', desc: '細線版' },
    ];
    const bold = [
      { id: 'G1', file: 'hero-kv-plume-bold.svg', title: 'G1 · 噴流尾焰（加強）', desc: '由左向右長尾流' },
      { id: 'G2', file: 'hero-kv-streamlines-bold.svg', title: 'G2 · 氣動流線（加強）', desc: '橫向滿版曲線' },
      { id: 'G3', file: 'hero-kv-thrust-bold.svg', title: 'G3 · 推力矢（加強）', desc: '橫向箭羽鏈' },
      { id: 'G4', file: 'hero-kv-turbine-bold.svg', title: 'G4 · 渦輪（加強）', desc: '偏右同心' },
      { id: 'G5', file: 'hero-kv-contrail-bold.svg', title: 'G5 · 航跡', desc: '橫跨畫面曲線' },
      { id: 'G6', file: 'hero-kv-lattice-bold.svg', title: 'G6 · 格柵', desc: '透視三角網' },
      { id: 'G7', file: 'hero-kv-wingmark-bold.svg', title: 'G7 · 雙翼', desc: '偏側符號' },
    ];
    const standard = [
      { id: 'A', file: 'hero-kv.svg', title: 'A · 噴流尾焰', desc: '目前官網' },
      { id: 'B', file: 'hero-kv-turbine.svg', title: 'B · 渦輪同心', desc: '淡色' },
      { id: 'C', file: 'hero-kv-streamlines.svg', title: 'C · 氣動流線', desc: '淡色' },
      { id: 'D', file: 'hero-kv-thrust.svg', title: 'D · 推力矢', desc: '淡色' },
      { id: 'E', file: 'hero-kv-wingmark.svg', title: 'E · Logo 雙翼', desc: '淡色' },
      { id: 'F', file: 'hero-kv-altitude.svg', title: 'F · 升限弧線', desc: '淡色' },
    ];
    document.getElementById('grid-product').innerHTML = product.map((o) => renderCard(o, 'product')).join('');
    document.getElementById('grid-focus').innerHTML = focus.map((o) => renderCard(o, 'focus')).join('');
    document.getElementById('grid-bold').innerHTML = bold.map((o) => renderCard(o, 'bold')).join('');
    document.getElementById('grid').innerHTML = standard.map((o) => renderCard(o, 'std')).join('');
  </script>
</body>
</html>
