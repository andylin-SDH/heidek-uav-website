<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hero KV 方案預覽（內部）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body.preview-page {
      font-family: var(--font-sans);
      background: #0d0c0c;
      color: #eee;
      padding: 24px;
      margin: 0;
    }
    body.preview-page > h1 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 8px;
      max-width: 900px;
    }
    body.preview-page > p.intro {
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 24px;
      max-width: 900px;
      line-height: 1.65;
    }
    .preview-composite { margin-bottom: 40px; }
    .preview-composite__meta {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e8c47a;
      margin-bottom: 10px;
    }
    .preview-composite__meta span { color: #888; font-weight: 400; font-size: 0.8rem; }
    .preview-composite__frame {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(118, 167, 75, 0.35);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
      background: var(--color-bg-dark);
    }
    .preview-composite .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(33, 29, 30, 0.92);
      backdrop-filter: blur(10px);
    }
    .preview-composite .nav__logo-img { height: 32px; }
    .preview-composite .nav__menu {
      display: flex;
      gap: 6px 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
      position: static;
      inset: auto;
      opacity: 1;
      pointer-events: none;
      flex-direction: row;
      background: transparent;
    }
    .preview-composite .nav__link {
      font-size: 0.62rem;
      color: rgba(255, 255, 255, 0.75);
      white-space: nowrap;
    }
    .preview-composite .nav__link--cta {
      background: var(--color-accent);
      color: #fff !important;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .preview-composite .nav__toggle { display: none; }
    .preview-composite .hero {
      min-height: clamp(440px, 52vw, 620px);
      padding-top: 64px;
    }
    .preview-composite .hero__content {
      padding: 48px 24px 64px;
    }
    .preview-composite .hero__title {
      font-size: clamp(1.65rem, 3.8vw, 2.65rem);
    }
    .preview-composite .hero__desc {
      font-size: 0.92rem;
      line-height: 1.75;
    }
    .preview-composite .hero__badge {
      font-size: 0.62rem;
      padding: 6px 12px;
      margin-bottom: 20px;
    }
    .preview-composite .hero__kv-img {
      animation: none !important;
      transform: none !important;
    }
  </style>
</head>
<body class="preview-page">
  <h1>Hero 主視覺方案（V1–V3）</h1>
  <p class="intro">
    官網目前暫用 <strong style="color:#8BB863">V1</strong>。若要改為 V2 或 V3，跟我說一聲再換
    <code>index.html</code> 的 <code>hero--ref-v*</code> 類名與圖檔。
  </p>
  <div id="composite-heroes"></div>

  <template id="hero-shell">
    <header class="header">
      <nav class="nav container">
        <a href="#" class="nav__logo" tabindex="-1">
          <img class="nav__logo-img" src="assets/images/logo-icon.png" alt="">
        </a>
        <ul class="nav__menu">
          <li><a href="#" class="nav__link" tabindex="-1">產品系列</a></li>
          <li><a href="#" class="nav__link" tabindex="-1">工況特性</a></li>
          <li><a href="#" class="nav__link" tabindex="-1">試飛程序</a></li>
          <li><a href="#" class="nav__link" tabindex="-1">安全準則</a></li>
          <li><a href="#" class="nav__link nav__link--cta" tabindex="-1">聯繫詢價</a></li>
        </ul>
      </nav>
    </header>
    <section class="hero">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__kv">
          <picture>
            <source type="image/webp" srcset="">
            <img class="hero__kv-img" src="" alt="" decoding="async">
          </picture>
        </div>
        <div class="hero__overlay"></div>
      </div>
      <div class="container hero__content hero__content--doc">
        <div class="hero__badge">Aerospace Micro Turbojet Propulsion Systems</div>
        <h1 class="hero__title">航太級微型渦輪噴射發動機系列</h1>
        <div class="hero__rule" aria-hidden="true"></div>
        <p class="hero__subtitle">Web Specification &amp; Operations Guide</p>
        <p class="hero__desc">
          本系列微型渦輪噴射發動機專為中大型高速戰術靶機、偵察／攻擊無人機（UAV）及航空動力驗證平台打造。具備高推重比、緊湊外徑與數位化 ECU 全自動一鍵啟動等特性，可適應高空、低溫與高亞音速等嚴苛飛行包線。
        </p>
      </div>
    </section>
  </template>

  <script>
    const composites = [
      {
        id: 'v1',
        heroClass: 'hero--ref-v1',
        file: 'hero-ref-v1-intake.jpg',
        title: 'V1 · 進氣扇葉＋氣動流線',
        desc: '參考圖 1',
      },
      {
        id: 'v2',
        heroClass: 'hero--ref-v2',
        file: 'hero-ref-v2-turbine.jpg',
        title: 'V2 · 渦輪燃燒核心',
        desc: '參考圖 2',
      },
      {
        id: 'v3',
        heroClass: 'hero--ref-v3',
        file: 'hero-ref-v3-landscape.jpg',
        title: 'V3 · 引擎＋地貌航太情境',
        desc: '參考圖 3',
      },
    ];
    const shell = document.getElementById('hero-shell');
    const mount = document.getElementById('composite-heroes');
    composites.forEach((c) => {
      const wrap = document.createElement('div');
      wrap.className = 'preview-composite';
      wrap.id = c.id;
      wrap.innerHTML = `<p class="preview-composite__meta">${c.title} <span>— ${c.desc}</span></p>`;
      const frame = document.createElement('div');
      frame.className = 'preview-composite__frame';
      const frag = shell.content.cloneNode(true);
      const hero = frag.querySelector('.hero');
      hero.classList.add(c.heroClass);
      const stem = c.file.replace(/\.jpg$/, '');
      frag.querySelector('.hero__kv source').srcset = `assets/images/${stem}.webp`;
      frag.querySelector('.hero__kv-img').src = `assets/images/${c.file}`;
      frame.appendChild(frag);
      wrap.appendChild(frame);
      mount.appendChild(wrap);
    });
  </script>
</body>
</html>
