<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Hero KV 方案預覽（內部）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body.preview-page { font-family: var(--font-sans); background: #0d0c0c; color: #eee; padding: 24px; margin: 0; }
    body.preview-page > h1 { font-size: 1.15rem; font-weight: 600; margin-bottom: 8px; max-width: 900px; }
    body.preview-page > p.intro { font-size: 0.85rem; color: #999; margin-bottom: 16px; max-width: 900px; line-height: 1.65; }
    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); margin-bottom: 32px; }
    .grid--focus article h3 { color: #b8e08a; }
    .preview-composite { margin-bottom: 40px; }
    .preview-composite__meta { font-size: 0.9rem; font-weight: 600; color: #e8c47a; margin-bottom: 10px; }
    .preview-composite__meta span { color: #888; font-weight: 400; font-size: 0.8rem; }
    .preview-composite__frame {
      position: relative; border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(118, 167, 75, 0.35);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.45);
      background: var(--color-bg-dark);
    }
    .preview-composite .header {
      position: absolute; top: 0; left: 0; right: 0; height: 64px;
      background: rgba(33, 29, 30, 0.92); backdrop-filter: blur(10px);
    }
    .preview-composite .nav__logo-img { height: 32px; }
    .preview-composite .nav__menu {
      display: flex; gap: 6px 14px; flex-wrap: wrap; justify-content: flex-end;
      position: static; inset: auto; opacity: 1; pointer-events: none;
      flex-direction: row; background: transparent;
    }
    .preview-composite .nav__link { font-size: 0.62rem; color: rgba(255, 255, 255, 0.75); white-space: nowrap; }
    .preview-composite .nav__toggle { display: none; }
    .preview-composite .hero { min-height: clamp(440px, 52vw, 620px); padding-top: 64px; }
    .preview-composite .hero__content { padding: 48px 24px 64px; }
    .preview-composite .hero__title { font-size: clamp(1.65rem, 3.8vw, 2.65rem); }
    .preview-composite .hero__desc { font-size: 0.92rem; line-height: 1.75; }
    .preview-composite .hero__badge { font-size: 0.62rem; padding: 6px 12px; margin-bottom: 20px; }
    .preview-composite .hero__kv-img { animation: none !important; transform: none !important; }
    .preview-hero--v1 .hero__kv-img { object-position: 72% center; }
    .preview-hero--v1 .hero__overlay {
      background:
        linear-gradient(102deg, rgba(24, 22, 23, 0.96) 0%, rgba(24, 22, 23, 0.82) 36%, rgba(24, 22, 23, 0.28) 62%, rgba(24, 22, 23, 0.05) 100%),
        linear-gradient(to top, rgba(24, 22, 23, 0.75) 0%, transparent 42%),
        radial-gradient(ellipse 45% 35% at 78% 45%, rgba(118, 167, 75, 0.12) 0%, transparent 70%);
    }
    .preview-hero--v2 .hero__kv-img { object-position: 68% center; }
    .preview-hero--v2 .hero__overlay {
      background:
        linear-gradient(105deg, rgba(20, 18, 18, 0.97) 0%, rgba(20, 18, 18, 0.85) 34%, rgba(20, 18, 18, 0.35) 58%, rgba(20, 18, 18, 0.08) 100%),
        linear-gradient(to top, rgba(20, 18, 18, 0.8) 0%, transparent 45%),
        radial-gradient(ellipse 50% 40% at 70% 50%, rgba(118, 167, 75, 0.08) 0%, transparent 65%);
    }
    .preview-hero--v3 .hero__kv-img { object-position: 62% 42%; }
    .preview-hero--v3 .hero__overlay {
      background:
        linear-gradient(108deg, rgba(22, 20, 20, 0.95) 0%, rgba(22, 20, 20, 0.78) 38%, rgba(22, 20, 20, 0.32) 64%, rgba(22, 20, 20, 0.06) 100%),
        linear-gradient(to top, rgba(15, 12, 10, 0.82) 0%, transparent 50%),
        radial-gradient(ellipse 55% 45% at 65% 40%, rgba(201, 166, 106, 0.06) 0%, transparent 60%);
    }
    .preview-divider { border: 0; border-top: 1px solid #333; margin: 48px 0 32px; }
  </style>
</head>
<body class="preview-page">
  <h1>Hero 主視覺方案（內部比稿）</h1>
  <p class="intro">目前上線：<strong style="color:#8BB863">P0 · hero-kv-premium.svg</strong>。下方 <strong style="color:#e8c47a">V1–V3</strong> 為三張參考圖 × 官網首頁合成，僅比稿；選定後才會改 <code>index.html</code>。</p>

  <h2 style="font-size:0.95rem;margin:20px 0 12px;color:#e8c47a">★ 參考圖 × 首頁合成（V1–V3）</h2>
  <p class="intro" style="margin-top:-8px">翔隆 Logo、四項導覽、官網原文案與綠色膠囊標籤。</p>
  <div id="composite-heroes"></div>

  <template id="hero-shell">
    <header class="header">
      <nav class="nav container">
        <a href="#" class="nav__logo" tabindex="-1">
          <img class="nav__logo-img" src="assets/images/logo-icon.png" alt="">
        </a>
        <ul class="nav__menu">
          <li><a href="#" class="nav__link" tabindex="-1">1. 全系列規格對比表</a></li>
          <li><a href="#" class="nav__link" tabindex="-1">2. 各機型動態工況特性</a></li>
          <li><a href="#" class="nav__link" tabindex="-1">3. 試車自檢標準作業程序</a></li>
          <li><a href="#" class="nav__link" tabindex="-1">4. 試車場地安全隔離準則</a></li>
        </ul>
      </nav>
    </header>
    <section class="hero preview-hero">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__kv">
          <img class="hero__kv-img" src="" alt="">
        </div>
        <div class="hero__overlay"></div>
      </div>
      <div class="container hero__content hero__content--doc">
        <div class="hero__badge">Aerospace Micro Turbojet Propulsion Systems</div>
        <h1 class="hero__title">航太級微型渦輪噴射發動機系列</h1>
        <div class="hero__rule" aria-hidden="true"></div>
        <p class="hero__subtitle">Web Specification &amp; Operations Guide</p>
        <p class="hero__desc">
          本系列微型渦輪噴射發動機專為中大型高速戰術靶機、偵察／攻擊無人機（UAV）及航空動力驗證平台打造。具備高推重比、緊湊外徑與數位化 ECU 全自動一鍵啟動等特性，可適應高空、低溫與高亞音速等嚴苛飛行包線。
        </p>
      </div>
    </section>
  </template>

  <hr class="preview-divider">

  <h2 style="font-size:0.95rem;margin:28px 0 12px;color:#c9a66a">★ 產品意象系列（依客戶實機發想）</h2>
  <p style="margin-top:-8px;margin-bottom:12px;font-size:0.8rem">側視圓柱段、進氣盆＋鼻錐三臂、尾噴口與金屬環—避免雷達式 360° 放射。</p>
  <div class="grid" id="grid-product" style="margin-bottom:32px"></div>
  <h2 style="font-size:0.95rem;margin:28px 0 12px;color:#8BB863">集中視覺系列</h2>
  <p style="margin-top:-8px;margin-bottom:12px;font-size:0.8rem">單一焦點約在畫面中央偏右，線條收斂、不散落滿版。</p>
  <div class="grid grid--focus" id="grid-focus"></div>
  <h2 style="font-size:0.95rem;margin:28px 0 12px;color:#ccc">色線加強系列（橫向發散）</h2>
  <div class="grid" id="grid-bold"></div>
  <h2 style="font-size:0.95rem;margin:28px 0 12px;color:#ccc">標準系列</h2>
  <div class="grid" id="grid"></div>
  <script>
    function renderCard(o, style) {
      const styles = {
        product: { border: '#c9a66a', glow: 'box-shadow:0 0 28px rgba(201,166,106,0.2)' },
        focus: { border: '#76A74B', glow: 'box-shadow:0 0 24px rgba(118,167,75,0.15)' },
        bold: { border: '#4a7330', glow: 'box-shadow:0 0 0 1px rgba(139,184,99,0.25)' },
        std: { border: '#333', glow: '' },
      };
      const s = styles[style];
      return `
        <article>
          <div style="border:1px solid ${s.border};border-radius:12px;overflow:hidden;margin-bottom:8px;${s.glow}">
            <img src="assets/images/${o.file}" alt="" style="width:100%;aspect-ratio:3/2;object-fit:cover;display:block">
          </div>
          <h3 style="font-size:0.95rem;margin-bottom:4px">${o.title}</h3>
          <p style="font-size:0.8rem;color:#888;margin:0">${o.desc}</p>
        </article>
      `;
    }
    const product = [
      { id: 'V1-thumb', file: 'hero-ref-v1-intake.jpg', title: 'V1 · 參考合成（見頁頂）', desc: '進氣扇葉＋流線；錨點 #v1' },
      { id: 'V2-thumb', file: 'hero-ref-v2-turbine.jpg', title: 'V2 · 參考合成（見頁頂）', desc: '渦輪燃燒核心；錨點 #v2' },
      { id: 'V3-thumb', file: 'hero-ref-v3-landscape.jpg', title: 'V3 · 參考合成（見頁頂）', desc: '引擎＋地貌；錨點 #v3' },
      { id: 'P0', file: 'hero-kv-premium.svg', title: 'P0 · 精緻合成（官網現用）', desc: '實機剪影 + 金屬進氣 + 柔光尾焰 + 品牌綠輪光' },
      { id: 'PΔ', file: 'hero-kv-delta-turbojet.svg', title: 'PΔ · 三角翼＋渦輪（草稿，勿上線）', desc: '參考稿方向初稿，品質不足僅供內部比對' },
      { id: 'P0b', file: 'hero-kv-engine-intake-premium.svg', title: 'P0b · 進氣精緻版', desc: '純向量、較極簡' },
      { id: 'P1', file: 'hero-kv-engine-profile-bold.svg', title: 'P1 · 側視剖面', desc: '圓柱環帶 + 安裝耳 + 尾錐噴流（單軸推力）' },
      { id: 'P2', file: 'hero-kv-engine-intake-bold.svg', title: 'P2 · 進氣正面', desc: '雙環 + 三臂鼻錐（對應實機進氣）' },
      { id: 'P3', file: 'hero-kv-engine-stack-bold.svg', title: 'P3 · 本體環段', desc: '側向角度金屬環，非平面雷達' },
      { id: 'P4', file: 'hero-kv-engine-exhaust-bold.svg', title: 'P4 · 尾噴口', desc: '耐熱鼻錐色 + 單向噴流' },
      { id: 'P5', file: 'hero-kv-engine-duotone.svg', title: 'P5 · 實機剪影', desc: '產品照低透明度＋暗角（不搶文案）' },
    ];
    const focus = [
      { id: 'H1', file: 'hero-kv-focus-plume-bold.svg', title: 'H1 · 中心噴流（加強）', desc: '放射橢圓 + 中心噴口，色線飽和' },
      { id: 'H2', file: 'hero-kv-focus-plume.svg', title: 'H2 · 中心噴流', desc: '低調版同心尾焰' },
      { id: 'H3', file: 'hero-kv-focus-rings-bold.svg', title: 'H3 · 中心渦輪環', desc: '三層同心圓集中在焦點' },
      { id: 'H4', file: 'hero-kv-focus-burst-bold.svg', title: 'H4 · 中心放射', desc: '短射線，不拉滿畫面' },
      { id: 'H5', file: 'hero-kv-focus-flow-bold.svg', title: 'H5 · 中心層流', desc: '橢圓層流包覆核心' },
      { id: 'H6', file: 'hero-kv-focus-wing-bold.svg', title: 'H6 · 中心雙翼', desc: 'Logo 置中 + 暈圈' },
      { id: 'H7', file: 'hero-kv-focus-axis-bold.svg', title: 'H7 · 中心軸線', desc: '十字推力軸，最簡潔' },
      { id: 'H8', file: 'hero-kv-focus-axis.svg', title: 'H8 · 中心軸線（淡）', desc: '細線版' },
    ];
    const bold = [
      { id: 'G1', file: 'hero-kv-plume-bold.svg', title: 'G1 · 噴流尾焰（加強）', desc: '由左向右長尾流' },
      { id: 'G2', file: 'hero-kv-streamlines-bold.svg', title: 'G2 · 氣動流線（加強）', desc: '橫向滿版曲線' },
      { id: 'G3', file: 'hero-kv-thrust-bold.svg', title: 'G3 · 推力矢（加強）', desc: '橫向箭羽鏈' },
      { id: 'G4', file: 'hero-kv-turbine-bold.svg', title: 'G4 · 渦輪（加強）', desc: '偏右同心' },
      { id: 'G5', file: 'hero-kv-contrail-bold.svg', title: 'G5 · 航跡', desc: '橫跨畫面曲線' },
      { id: 'G6', file: 'hero-kv-lattice-bold.svg', title: 'G6 · 格柵', desc: '透視三角網' },
      { id: 'G7', file: 'hero-kv-wingmark-bold.svg', title: 'G7 · 雙翼', desc: '偏側符號' },
    ];
    const standard = [
      { id: 'A', file: 'hero-kv.svg', title: 'A · 噴流尾焰', desc: '目前官網' },
      { id: 'B', file: 'hero-kv-turbine.svg', title: 'B · 渦輪同心', desc: '淡色' },
      { id: 'C', file: 'hero-kv-streamlines.svg', title: 'C · 氣動流線', desc: '淡色' },
      { id: 'D', file: 'hero-kv-thrust.svg', title: 'D · 推力矢', desc: '淡色' },
      { id: 'E', file: 'hero-kv-wingmark.svg', title: 'E · Logo 雙翼', desc: '淡色' },
      { id: 'F', file: 'hero-kv-altitude.svg', title: 'F · 升限弧線', desc: '淡色' },
    ];
    const composites = [
      {
        id: 'v1',
        cls: 'preview-hero--v1',
        file: 'hero-ref-v1-intake.jpg',
        title: 'V1 · 進氣扇葉＋氣動流線',
        desc: '參考圖 1：右側涵道進氣、左向流線；遮罩保留左側文案區',
      },
      {
        id: 'v2',
        cls: 'preview-hero--v2',
        file: 'hero-ref-v2-turbine.jpg',
        title: 'V2 · 渦輪燃燒核心',
        desc: '參考圖 2：橘金燃燒光＋粒子流；加深左側漸層以利閱讀',
      },
      {
        id: 'v3',
        cls: 'preview-hero--v3',
        file: 'hero-ref-v3-landscape.jpg',
        title: 'V3 · 引擎＋地貌航太情境',
        desc: '參考圖 3：進氣特寫與山系景深；底部略壓暗呼應飛行任務感',
      },
    ];
    const shell = document.getElementById('hero-shell');
    const mount = document.getElementById('composite-heroes');
    if (!shell || !mount) throw new Error('composite mount missing');
    composites.forEach((c) => {
      const wrap = document.createElement('div');
      wrap.className = 'preview-composite';
      wrap.id = c.id;
      wrap.innerHTML = `<p class="preview-composite__meta">${c.title} <span>— ${c.desc}</span></p>`;
      const frame = document.createElement('div');
      frame.className = 'preview-composite__frame';
      const frag = shell.content.cloneNode(true);
      const hero = frag.querySelector('.hero');
      hero.classList.add(c.cls);
      frag.querySelector('.hero__kv-img').src = `assets/images/${c.file}`;
      frame.appendChild(frag);
      wrap.appendChild(frame);
      mount.appendChild(wrap);
    });

    document.getElementById('grid-product').innerHTML = product.map((o) => renderCard(o, 'product')).join('');
    document.getElementById('grid-focus').innerHTML = focus.map((o) => renderCard(o, 'focus')).join('');
    document.getElementById('grid-bold').innerHTML = bold.map((o) => renderCard(o, 'bold')).join('');
    document.getElementById('grid').innerHTML = standard.map((o) => renderCard(o, 'std')).join('');
  </script>
</body>
</html>
